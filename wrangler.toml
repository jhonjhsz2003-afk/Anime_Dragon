name = "site"
main = "worker.js"
compatibility_date = "2026-09-13"
# Necessario para fetch() entre Workers via endereco workers.dev publico.
compatibility_flags = ["global_fetch_strictly_public"]

[assets]
directory = "./web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "animedragon-db"
database_id = "fdf0ea3e-42f9-46a3-b92f-e8b9632cca63"

[triggers]
crons = ["0 */6 * * *"]

[observability]
enabled = true

[vars]
# URL publica do DragonGIF v3.0 (outro subdominio Cloudflare). Sem Service Binding: acesso HTTPS entre contas.
DRAGONGIF_PUBLIC_URL = "https://dragongif-api.jhonjhszgame2003.workers.dev"
