name = "site"
main = "worker.js"
compatibility_date = "2026-09-13"

[assets]
directory = "./web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "animedragon-db"
database_id = "fdf0ea3e-42f9-46a3-b92f-e8b9632cca63"

[triggers]
crons = ["0 */6 * * *"]

[observability]
enabled = true

# DragonGIF deve ser publicado primeiro, com o nome de Worker 'dragongif-api'.
[[services]]
binding = "DRAGONGIF"
service = "dragongif-api"

[vars]
# URL publica do DragonGIF v3.0 informada pelo usuario e confirmada pela resposta /api/v1/health.
DRAGONGIF_PUBLIC_URL = "https://dragongif-api.jhonjhszgame2003.workers.dev"
